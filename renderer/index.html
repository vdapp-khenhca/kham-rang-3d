<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khám Răng 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="appbar">
  <div class="logo">Khám Răng 3D</div>
  <nav><button type="button" data-nav="home" aria-current="true">Khách hàng</button><button type="button" data-nav="settings" aria-current="false">Cài đặt</button></nav>
  <div class="spacer"></div>
  <div class="upd" id="upd" hidden></div>
  <span class="ver" id="ver"></span>
</header>

<section id="vHome" class="page">
  <div class="home">
    <div class="homehead">
      <div><h1>Khách hàng</h1><p class="muted">Bấm "Tạo hồ sơ khách", nhập thông tin, rồi tải scan 3D, CT hoặc X-quang lên và bấm "Phân tích kết hợp".</p></div>
      <div class="row"><input type="text" id="q" placeholder="Tìm theo tên" aria-label="Tìm khách"><button class="btn" type="button" id="newCase">Tạo hồ sơ khách</button></div>
    </div>
    <div class="homegrid">
      <div class="tw"><table id="caseTbl"></table></div>
      <aside class="panel"><h3>Cần gọi chăm sóc</h3><div id="dueList"></div></aside>
    </div>
  </div>
</section>

<section id="vCase" class="page" hidden>
  <div class="app">
    <main class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div id="labs"></div>
      <div class="bar">
        <button class="tool btn" id="back" type="button">← Danh sách</button>
        <div class="chip" id="stat"></div>
        <label class="tool" id="tU" hidden><input type="checkbox" id="vU" checked> Hàm trên</label>
        <label class="tool" id="tL" hidden><input type="checkbox" id="vL" checked> Hàm dưới</label>
        <label class="tool"><input type="checkbox" id="vT" checked> Tô màu trạng thái</label>
        <button class="tool btn" id="aiAll" type="button" hidden>AI khám tất cả răng</button>
        <button class="tool btn" id="markU" type="button" hidden>Đánh dấu thủ công hàm trên</button>
        <button class="tool btn" id="markL" type="button" hidden>Đánh dấu thủ công hàm dưới</button>
      </div>
      <div class="guide" id="guide" hidden></div>
      <div class="views" id="views">
        <button class="tool btn" data-v="front" type="button">Trước</button><button class="tool btn" data-v="top" type="button">Trên</button><button class="tool btn" data-v="bottom" type="button">Dưới</button><button class="tool btn" data-v="left" type="button">Trái</button><button class="tool btn" data-v="right" type="button">Phải</button>
      </div>
      <div class="hud" id="hud" hidden></div>
      <div class="busy" id="busy" hidden>Đang xử lý…</div>
    </main>
    <aside class="side">
      <div class="sh"><h2 id="caseT"></h2><p id="caseS"></p></div>
      <div class="tabs" role="tablist"><button type="button" role="tab" data-tab="scan" aria-selected="true">AI phân tích</button><button type="button" role="tab" data-tab="exam" aria-selected="false">Bác sĩ hội chẩn</button><button type="button" role="tab" data-tab="doc" aria-selected="false">PDF</button><button type="button" role="tab" data-tab="care" aria-selected="false">Chăm sóc</button></div>
      <div class="sb" id="sb"></div>
    </aside>
  </div>
</section>

<section id="vSettings" class="page" hidden><div class="settings" id="setBody"></div></section>
<div class="toast" id="toast" hidden></div>

<dialog id="newDlg" style="border:1px solid #ccc;border-radius:10px;padding:18px;min-width:340px"><h3 style="margin:0 0 10px">Hồ sơ khách mới</h3><div class="form"><label class="f">Họ và tên<input type="text" id="nName"></label><div class="f3"><label class="f">Năm sinh<input type="text" id="nYear"></label><label class="f">Giới tính<select id="nGender"><option></option><option>Nam</option><option>Nữ</option></select></label><label class="f">Điện thoại<input type="text" id="nPhone"></label></div><label class="f">Tiền sử, lưu ý (dị ứng, bệnh nền, thuốc đang dùng)<textarea id="nHist"></textarea></label><div class="row sp"><button class="btn ghost" type="button" id="nCancel">Hủy</button><button class="btn" type="button" id="nOk">Tạo hồ sơ</button></div></div></dialog>
<script src="vendor/three.min.js"></script>
<script src="vendor/PLYLoader.js"></script>
<script src="vendor/STLLoader.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="detect.js"></script>
<script src="dicom.js"></script>
<script src="ct.js"></script>
<script src="ctview.js"></script>
<script src="report.js"></script>
<script src="app.js"></script>
</body>
</html>
